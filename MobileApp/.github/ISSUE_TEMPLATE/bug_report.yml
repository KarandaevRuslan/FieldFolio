name: Bug report
description: Report a reproducible Fieldfolio problem.
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and Android version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Orientation, screen, model/element type and logs
      description: Remove credentials, location details and private report content before attaching logs.
