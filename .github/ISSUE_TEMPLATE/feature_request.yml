name: Feature request
description: Propose an improvement to the application, server, or tooling.
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - MobileApp
        - Server
        - DetectionTrainProj
        - Shared tooling / documentation
  - type: textarea
    id: use_case
    attributes:
      label: Use case and desired behavior
    validations:
      required: true
