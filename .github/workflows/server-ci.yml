name: Server CI
on:
  push:
    branches: [main]
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'Server/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Server/pom.xml
      - name: Compile, test (where present), and package
        run: mvn -B -ntp -f Server/pom.xml verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldfolio-server-jar
          if-no-files-found: error
          retention-days: 14
          path: Server/target/*.jar
