name: Repository policy and docs
on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  pull_request:
    paths:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-and-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check tracked files, paths, docs and policies
        run: python3 scripts/check_monorepo.py
      - name: Policy regression tests
        run: python3 -m unittest discover -s tests -v
