name: Fieldfolio APK from version tag
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed release draft (select an exact version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/mobile-ci.yml
  tag-apk:
    if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.signed)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fieldfolio-debug
          path: apk
      - name: Create versioned test APK and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp apk/app-debug.apk "release/Fieldfolio-${{RELEASE_TAG}}-debug.apk"
          (cd release && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fieldfolio-${{ github.ref_name }}-debug
          path: release/
          retention-days: 30
          if-no-files-found: error
  signed-draft:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: MobileApp/.node-version
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version-file: MobileApp/.java-version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Check tag matches Android version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/check_tag.py "$RELEASE_TAG"
      - name: Rebuild WebView assets
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: MobileApp/acode-web
      - name: Provision release credentials
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
          FIELDFOLIO_KEYSTORE_BASE64: ${{ secrets.FIELDFOLIO_KEYSTORE_BASE64 }}
        run: python3 scripts/release/prepare_inputs.py --signed
      - name: Build signed release APK
        env:
          FIELDFOLIO_STORE_PASSWORD: ${{ secrets.FIELDFOLIO_STORE_PASSWORD }}
          FIELDFOLIO_KEY_ALIAS: ${{ secrets.FIELDFOLIO_KEY_ALIAS }}
          FIELDFOLIO_KEY_PASSWORD: ${{ secrets.FIELDFOLIO_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify signature and create unpublished GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Fieldfolio-${{RELEASE_TAG}}.apk"
          (cd release && sha256sum *.apk > SHA256SUMS)
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Fieldfolio $RELEASE_TAG" --notes-file CHANGELOG.md
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/fieldfolio-release.jks" app/google-services.json
