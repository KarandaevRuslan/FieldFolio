name: Fieldfolio signed APK from version tag
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/mobile-ci.yml

  signed-release:
    # A pushed version tag builds a signed RELEASE APK and uploads it to a draft
    # GitHub Release. There is no debug APK release job for tag events.
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: MobileApp/.node-version
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version-file: MobileApp/.java-version
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-disabled: true
      - name: Validate version tag against Gradle metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release/check_tag.py "$RELEASE_TAG"
      - name: Build WebView assets
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: MobileApp/acode-web
      - name: Restore Firebase and signing credentials
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_BASE64 }}
          FIELDFOLIO_SIGNING_BUNDLE_BASE64: ${{ secrets.FIELDFOLIO_SIGNING_BUNDLE_BASE64 }}
        run: python3 scripts/release/prepare_inputs.py --signed
      - name: Assemble signed release APK
        run: bash gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Create or update draft release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Fieldfolio-${RELEASE_TAG}.apk"
          (cd release && sha256sum *.apk > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != 'true' ]]; then
              echo 'Release already published; refusing to overwrite its files.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --draft --verify-tag --title "Fieldfolio $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
      - name: Remove temporary credentials
        if: always()
        run: rm -f app/google-services.json config/keystore.properties && rm -rf ci-signing
