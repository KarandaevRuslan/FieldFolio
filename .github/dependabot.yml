version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /MobileApp/acode-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /MobileApp
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: maven
    directory: /Server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /DetectionTrainProj
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
